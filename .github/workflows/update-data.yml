name: Update data screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract supplied screener files
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "idx-screener (1).zip" ]; then
            rm -rf .screener_extract
            mkdir .screener_extract
            unzip -o "idx-screener (1).zip" -d .screener_extract >/dev/null
            for f in index.html universe.csv custom-indicators.json README.md; do
              src="$(find .screener_extract -type f -name "$f" -print -quit || true)"
              [ -z "$src" ] || cp "$src" "$f"
            done
            rm -rf .screener_extract
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance>=0.2.50,<1" "pandas>=2.2,<3" "numpy>=1.26,<3"
      - name: Build screener data
        run: python scripts/fetch_data.py
      - name: Commit updated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html universe.csv custom-indicators.json README.md scripts/fetch_data.py data/screener.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update screener data"
          git push
